<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PhishingNet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a1a, #1a1a3e);
    }
    .logo {
      text-align: center;
      margin-bottom: 15px;
    }
    .logo h2 {
      color: white;
      font-size: 24px;
      margin: 0;
    }
    .logo span {
      color: #ff6b6b;
    }
    .status {
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      backdrop-filter: blur(10px);
    }
    .status .icon {
      font-size: 30px;
    }
    .status .text {
      font-size: 14px;
      color: #4ecdc4;
      margin-top: 5px;
      font-weight: 600;
    }
    .status .sub {
      font-size: 12px;
      color: #aaa;
      margin-top: 3px;
    }
    .info {
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #ccc;
      backdrop-filter: blur(10px);
    }
    .info div {
      padding: 4px 0;
      display: flex;
      justify-content: space-between;
    }
    .info strong {
      color: #fff;
    }
    .info .online {
      color: #4ecdc4;
    }
    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 11px;
      color: #666;
    }
    .footer .team {
      color: #888;
      font-size: 10px;
      margin-top: 2px;
    }
    .footer .heart {
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="logo">
    <h2>🛡️ Phishing<span>Net</span></h2>
  </div>

  <div class="status">
    <div class="icon">✅</div>
    <div class="text">Protection Active</div>
    <div class="sub">AI-Powered Real-time Detection</div>
  </div>

  <div class="info">
    <div><strong>Status:</strong> <span class="online">● Online</span></div>
    <div><strong>Detection:</strong> Hybrid AI + LLM</div>
    <div><strong>Version:</strong> 2.0.0</div>
  </div>

  <div class="footer">
    <div>Made with <span class="heart">❤️</span> by Oxford College Students</div>
    <div class="team">Ameen • Abdul • Mohit • Sahil</div>
  </div>
</body>
</html>
